# IPPCP evidence export configuration.
#
# T1, T2, T3 and T4 are SLOT POSITIONS, not asset types.
# The asset occupying a slot is classified from the run (summary/manifest/metadata).
#
# Slot selection is explicit:
# - --tests SLOT=SUFFIX selects exactly those slots. No YAML autofill.
# - --preset NAME selects a named historical/canonical slot map.
# - --only-tests filters an already selected set; it does not invent slots.
#
# Current validated IPPCP runs (classified from evidence, not from slot id):
# - 1783070399  csv_b2_legacy
# - 1783070513  wfs_ciudad
# - 1783070583  sparql
#
# Historical test3-era delivery suffixes:
# - 1782294549  csv_b2_legacy
# - 1782299532  wfs_ciudad
# - 1782299641  sparql

defaults:
  repo_root: .
  evidence_dir: evidencias/runs
  downloads_dir: downloads
  sanitize_connectors: true
  redact_local_paths: true

profiles:
  default:
    sanitize_connectors: true
    redact_local_paths: true
  debug:
    sanitize_connectors: false
    redact_local_paths: false

connector_aliases:
  conn-erick-test3: conn-company-ippcp
  conn-edgar-test3: conn-citycouncil-ippcp

connector_semantics:
  conn-erick-test3:
    organization_role: company
    public_alias: conn-company-ippcp
  conn-edgar-test3:
    organization_role: citycouncil
    public_alias: conn-citycouncil-ippcp
  CONN-CITYCOUNCIL:
    organization_role: citycouncil
    public_alias: CONN-CITYCOUNCIL
  CONN-COMPANY:
    organization_role: company
    public_alias: CONN-COMPANY

expected_workflow_roles:
  ingesta:
    provider_role: company
    consumer_role: citycouncil
  ingesta_api:
    provider_role: citycouncil
    consumer_role: company
  consumo:
    provider_role: citycouncil
    consumer_role: company

assets:
  ingestion_api_v2:
    family: ingestion
    variant: pre_get
    display_name: Ingestion API PRE GET
    sheet_slug: ingestion_api
    transport: HttpData-PULL
    critical: true
    publication_profile: minimal_publication
    publication_safe: true
    workflow: ingesta_api
    asset_type: HttpData-PULL
    evidence_role: additional_validation
    expected_workflow_kind: b1
    expected_phases: [phase0, phase1, phase2, phase3, phase4]
    expected_content_kind: json
    expected_extension: json
    expected_media_type: application/json
    expected_transfer_type: HttpData-PULL
    technical_provider_connector: CONN-CITYCOUNCIL
    technical_consumer_connector: CONN-COMPANY
    asset_config: asset_configs/real/ingesta/ingesta_api_pull_pre_api_key.json
    validator: ingestion_api_v2
    match:
      identity: pre_get
      asset_slugs:
        - ippcp_ingesta_api_pull_pre_api_key
      asset_config_suffixes:
        - asset_configs/real/ingesta/ingesta_api_pull_pre_api_key.json
