# No implicit slot defaults. Historical/canonical runs are selected with --preset.
tests: {}

presets:
  legacy_assessment:
    description: >
      Delivered T1-T3 assessment evidence (CSV B2, WFS ciudad, SPARQL).
      Explicit historical selection. T* remain slots; assets are classified
      from each run. Uses current validated suffixes.
    tests:
      T1: "1783070399"
      T2: "1783070513"
      T3: "1783070583"
  legacy_test3:
    description: >
      test3-era historical suffixes. Explicit selection only.
      T* remain slots; assets are classified from each run.
    tests:
      T1: "1782294549"
      T2: "1782299532"
      T3: "1782299641"
